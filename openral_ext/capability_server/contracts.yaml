# The shared LunarBot capability set behind the common boundary (execution_plan §21.4, §8.2, §11.1).
#
# One contract per capability: what it does, typed inputs, what comes back. Ours renders these as tools, PLEXIL as
# Commands (effects) and Lookups (queries), EUROPA as activity types -- all three call
# space_harness_msgs/ExecuteCapability or QueryCapability with the same names and arguments.
#
# Forbidden here (§8.2): mission logic -- orderings, recoveries, "after X do Y". A contract says what one call means.
# Granularity (plan v4, execution_plan §8.2): a capability the mission agent sees is one physical operation with
# mission-level arguments. `engineering: true` marks stage-level capabilities (Cartesian moves, jaw, vision-guided
# stand-off) kept for engineering checks and for authoring procedures; they are not rendered as mission tools.
#
# Frames: `map` is the robot's own localization (AMCL on the surveyed base map); `chassis_base_link` is the rover.
# Inputs: {name: [type, required, description]}; types: number, number[N], string, string(a|b).
# Arguments come as a JSON object, or as a JSON array in the declared input order (typed PLEXIL Commands).

effects:
  navigate_to_pose:
    description: Drive the base to a planar pose in `map` along a collision-free path (Nav2 with the lidar costmaps).
    inputs:
      x: [number, true, "goal x in map, m"]
      y: [number, true, "goal y in map, m"]
      yaw: [number, true, "goal heading in map, rad"]
    default_deadline_s: 400
    authority_class: routine
    lowers_to: OpenRAL/rskill-nav2-mobile_base-navigate_to_pose

  dock_to_pose:
    description: >-
      Close the last metre onto an exact planar pose in `map` (omnidirectional servo that enters along the goal's own
      axis). For work poses next to structures, after navigate_to_pose has brought the base near.
    inputs:
      x: [number, true, "goal x in map, m"]
      y: [number, true, "goal y in map, m"]
      yaw: [number, true, "goal heading in map, rad"]
      approach_m: [number, false, "length of the entry corridor along the goal axis, m (default 1.5)"]
    default_deadline_s: 240
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-mobile_base-move_base_to_pose

  move_joints:
    description: Drive the 7 arm joints to target angles.
    inputs:
      joint_targets: ["number[7]", true, "RM-75 joint1..joint7, rad"]
      tolerance_rad: [number, false, "per-joint tolerance (default 0.08)"]
    default_deadline_s: 120
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-posture
    records_evidence: true
    engineering: true

  arm_ready:
    description: >-
      Raise the arm from its travel pose into the ready posture, along a path the robot's planner finds through what
      it knows and what its cameras have measured standing beside it.
    inputs:
      tolerance_rad: [number, false, "per-joint tolerance (default 0.08)"]
    default_deadline_s: 120
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-posture
    records_evidence: true

  stow:
    description: >-
      Fold the arm into its travel pose for driving, along a path the robot's planner finds through what it knows and
      what its cameras have measured standing beside it. The jaws must be empty: put a held item down first.
    inputs:
      tolerance_rad: [number, false, "per-joint tolerance (default 0.08)"]
    default_deadline_s: 120
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-posture
    records_evidence: true

  plan_ee_pose:
    description: >-
      Plan and execute a collision-checked arm motion (MoveIt, rover self-model) that puts the tool centre point at a
      pose in `chassis_base_link`. For large reconfigurations; the planning scene holds the rover, the surveyed site
      structures and the movable objects.
    inputs:
      position: ["number[3]", true, "TCP position in chassis_base_link, m"]
      orientation_xyzw: ["number[4]", true, "TCP orientation quaternion"]
      tolerance_m: [number, false, "position tolerance (default 0.01)"]
    default_deadline_s: 120
    authority_class: routine
    lowers_to: OpenRAL/rskill-moveit-multi-eef_pose
    engineering: true

  move_ee_to_pose:
    description: Servo the tool centre point in a straight Cartesian motion to a pose in `chassis_base_link` and hold.
    inputs:
      position: ["number[3]", true, "TCP position in chassis_base_link, m"]
      orientation_xyzw: ["number[4]", true, "TCP orientation quaternion"]
      tolerance_m: [number, false, "position tolerance (default 0.015)"]
      max_linear_speed_m_s: [number, false, "speed cap (default the skill's)"]
      timeout_s: [number, false, "servo timeout on the graph clock (default 25)"]
    default_deadline_s: 60
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-move_ee_to_pose
    engineering: true

  navigate_to_feature:
    description: >-
      Drive the base (Nav2) to the approach point of a site feature: `standoff_m` out along the feature's surface
      normal beyond the pose from which the arm reaches it, heading along the normal (rear towards the feature).
    inputs:
      feature: [string, true, "site interaction point, e.g. pdu_2_panel/press"]
      standoff_m: [number, false, "distance beyond the reach pose along the normal, m (default 1.5)"]
    default_deadline_s: 400
    authority_class: routine
    lowers_to: OpenRAL/rskill-nav2-mobile_base-navigate_to_pose

  move_base_delta:
    description: >-
      Move the base by a small offset given in the rover's own frame (x forward, y left, yaw counter-clockwise),
      holding everything else. For adjusting a stance the arm could not work from; the site's own places are reached
      with navigate_to_feature / dock_at_feature.
    inputs:
      dx_m: [number, false, "forward, m (default 0)"]
      dy_m: [number, false, "left, m (default 0)"]
      dyaw_rad: [number, false, "counter-clockwise, rad (default 0)"]
    default_deadline_s: 120
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-mobile_base-move_base_to_pose
    engineering: true

  dock_at_feature:
    description: >-
      Close onto the pose from which the arm reaches a site feature (hull + arm reach out along its normal), or
      `standoff_m` further out on that axis (to back away). Entered along the axis. The arm works off the rover's
      rear, so at this pose the rear faces the feature: the front camera looks away from it and the wrist camera can
      see the work area.
      The default distance is the roomiest stand the arm can put its tool at the work from; `work_stands` lists
      the stands that reach the work wherever the dock lands, with the `standoff_m` that parks at each.
    inputs:
      feature: [string, true, "site interaction point"]
      standoff_m: [number, false, "distance beyond the reach pose along the normal, m (default 0)"]
      approach_m: [number, false, "entry corridor length, m (default 1.5)"]
    default_deadline_s: 240
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-mobile_base-move_base_to_pose

  plan_ee_to_feature:
    description: >-
      Plan and execute (MoveIt) the TCP to `offset_m` in front of a surveyed site feature along its normal, tool into
      the surface; `orientation` press = jaw axis vertical, grip = horizontal. The feature is placed by the rover's
      localization, so expect several centimetres of error: good for bringing the tool and wrist camera near, not for
      contact.
    inputs:
      feature: [string, true, "site interaction point"]
      offset_m: [number, true, "distance in front of the feature along its normal, m (negative = into it)"]
      lift_m: [number, false, "vertical offset, m (default 0)"]
      orientation: ["string(press|grip)", false, "tool orientation (default press); the wrist camera's image is level in grip and turned 90 degrees in press"]
      tolerance_m: [number, false, "position tolerance (default 0.01)"]
    default_deadline_s: 120
    authority_class: routine
    lowers_to: OpenRAL/rskill-moveit-multi-eef_pose
    engineering: true

  move_ee_to_feature:
    description: >-
      Servo the TCP in a straight line to `offset_m` in front of a surveyed site feature along its normal (plus
      `lift_m` vertically) and hold; tool into the surface. Same localization error as plan_ee_to_feature.
    inputs:
      feature: [string, true, "site interaction point"]
      offset_m: [number, true, "distance in front of the feature along its normal, m (negative = into it)"]
      lift_m: [number, false, "vertical offset, m (default 0)"]
      orientation: ["string(press|grip)", false, "tool orientation (default press)"]
      tolerance_m: [number, false, "position tolerance (default 0.015)"]
      max_linear_speed_m_s: [number, false, "speed cap"]
      timeout_s: [number, false, "servo timeout on the graph clock (default 25)"]
    default_deadline_s: 60
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-move_ee_to_pose
    engineering: true

  approach_target:
    description: >-
      Bring the tool to `standoff_m` in front of a target described in words, facing it, guided by the wrist RGB-D
      camera: a vision-language model finds the target in the image, its depth gives the 3-D point, the tool servos
      to the stand-off, and the camera re-checks from there and corrects. The target must be in
      the wrist camera's view when called (use locate_in_view / observe to check). Describe it unambiguously by
      appearance and position (e.g. "the red mushroom-shaped push button, not the glowing round lamp"). Ends aligned
      with the target; finish contact with move_tool. The stand-off is measured from the target's visible surface
      point, and the tool centre point is midway between the fingertips.
    inputs:
      target: [string, true, "what to approach, described by appearance and position"]
      standoff_m: [number, false, "distance in front of the target to stop at, m (default 0.10)"]
      orientation: ["string(press|grip)", false, "tool orientation: press = jaw axis vertical, grip = horizontal (default press); the wrist camera's image is level in grip"]
    default_deadline_s: 300
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-move_ee_to_pose
    engineering: true

  move_tool:
    description: >-
      Move the tool in a straight line relative to where it is: `forward_m` along the tool axis (positive = the way
      the tool points), `up_m` vertically, `left_m` horizontally across the tool axis; orientation unchanged. For the
      last centimetres of contact (pushing a button, sliding the jaws over a handle) and for lifting or retreating.
      The tool centre point is midway between the fingertips: to have a part between the jaws, move it past the
      part's visible surface by about half the part's depth plus a centimetre or two.
    inputs:
      forward_m: [number, false, "along the tool axis, m (default 0)"]
      up_m: [number, false, "vertical, m (default 0)"]
      left_m: [number, false, "horizontal across the tool axis, m (default 0)"]
      max_linear_speed_m_s: [number, false, "speed cap (default the skill's)"]
      tolerance_m: [number, false, "position tolerance (default 0.015)"]
      timeout_s: [number, false, "servo timeout on the graph clock (default 25)"]
    default_deadline_s: 60
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-move_ee_to_pose
    engineering: true

  grasp:
    description: >-
      Close the jaws. Succeeds when they stop on something; fails with "nothing grasped" when they close fully
      (which is also how to close empty jaws on purpose).
    inputs: {}
    default_deadline_s: 20
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-grasp
    engineering: true

  pick:
    description: >-
      Pick up a stationary item by its catalogued lifting interface, with the arm and the wrist RGB-D camera, and
      lift it clear of where it stood. The arm needs no preparation. The item must be within the arm's reach behind
      the rover (dock at the item's work pose first). Say where the work is: the place frame the item stands on
      and how high the interface sits above it. The skill takes one view there, asks the vision-language model which
      surface in the view is the described item, fits the interface's declared shape to the depth image near it,
      and reports how much of that shape the picture agreed with. How to take hold is declared, not measured: the
      jaws close across the neck, the tool approaches along the support's surveyed normal, the fingers seat on the
      pads. The tool then servos in on the interface as re-fitted every frame, closes the jaws and checks the hold
      while lifting. On failure it reports the stage it reached (find, select, approach, grasp, hold), why, and
      what the camera and the vision model saw. It ends with the item held clear of where it stood and the arm in
      that carrying posture: the rover can drive like this, and
      the arm must not be folded (stow, arm_ready) until the item is set down.
    inputs:
      target: [string, true, "the item, described by what it is and how it looks (e.g. the spare ORU, a gold MLI-covered box)"]
      part: [string, true, "the contact region to hold, described in words (e.g. the narrow neck of the T-shaped handle)"]
      item: [string, false, "the item's name in the equipment catalogue; the skill then keeps its catalogued size clear of the rover while carrying"]
      support: [string, false, "the place frame the item stands on (e.g. depot_stand/slot_0), from site_map"]
      grasp_height_m: [number, false, "how high the lifting interface sits above the site frame: the place frame's own z from site_map plus the item's handle_height_above_base_m from the equipment catalogue. This is where the camera is pointed"]
    default_deadline_s: 900
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-pick
    records_evidence: true
    requires_remote_service: vision_language_model  # a choice among the grasps it finds; a non-answer fails the call

  place:
    description: >-
      Set the item held in the jaws down on a surveyed support: carry it above the support point, lower it until the
      support takes its weight, open the jaws, retreat clear and check that the item stays put. The support must be
      within the arm's reach behind the rover (dock at the support's work pose first). On failure it reports the stage
      reached (over, lower, release, retreat, settle) and why.
      For a side grasp beneath an overhanging head, select below_overhang so withdrawal stays parallel to the
      horizontal support before lifting clear; unconstrained withdraws along the current tool axis.
    inputs:
      support: [string, true, "a surveyed place point of type place from the site map, e.g. pdu_1_shelf/shelf"]
      release_constraint: ["string(unconstrained|below_overhang)", false, "the grasp interface's release constraint from equipment knowledge; default unconstrained"]
      item: [string, false, "the held item's name in the equipment catalogue; the skill then brings its catalogued size over the support clear of the support's edges"]
    default_deadline_s: 600
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-place
    records_evidence: true

  press:
    description: >-
      Press something described in words -- a button, a latch, a switch on a panel: find it in the wrist camera,
      stand off in front of it facing the surface, close in along the tool axis until the face takes the load, then
      withdraw. Describe the target by appearance and position; the equipment carries no readable labels. The target
      must be within the arm's reach behind the rover (dock at the feature's work pose first). The arm does not need
      to be in any particular posture: this plans its own way from wherever the arm is, so `arm_ready` beforehand is
      neither required nor useful -- at a work pose close enough to reach the panel, the ready posture may well not
      fit. On failure it reports the stage reached (locate, approach, press, retreat) and why.
    inputs:
      target: [string, true, "what to press, described by appearance and position"]
    default_deadline_s: 420
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-press
    records_evidence: true
    requires_remote_service: vision_language_model  # it finds the target by looking; a non-answer fails the call

  release:
    description: Open the jaws fully.
    inputs: {}
    default_deadline_s: 20
    authority_class: routine
    lowers_to: OpenRAL/rskill-procedural-lunar_bot-release

queries:
  site_map:
    description: >-
      The surveyed site (fixed infrastructure, `map`): every named interaction point with its type, position and
      outward normal, the camera view poses of the equipment, the graded road network the rover drives on, and the
      rover dock. Includes sourced equipment catalogue/interface descriptions, but no current movable-object poses.
    inputs: {}
  observe:
    description: >-
      Look through one of the rover's cameras and answer a question about what it sees right now (vision-language
      model on the current frame). `front` is the mast RGB-D camera looking ahead and slightly down; `wrist` is on the
      gripper, looking along the tool. The camera sees what its pose frames (move the rover or the arm to frame
      something); equipment carries no readable name labels, so describe the target by appearance and position. The
      answer is an observation, not ground truth; the frame is kept as evidence.
    uses_model: true   # answered by the remote vision model, so it can legitimately take tens of seconds
    inputs:
      camera: ["string(front|wrist)", true, "which camera"]
      question: [string, true, "what to look for, e.g. the colour of a status lamp or whether a place is occupied"]
  locate_in_view:
    description: >-
      Find a target described in words in one camera's current image (vision-language model) and measure it with the
      camera's depth: whether it is visible, its pixel position and box, and its 3-D position in `chassis_base_link`.
      Both cameras are RGB-D (RealSense D435i). The frame is kept as evidence.
    uses_model: true   # answered by the remote vision model, so it can legitimately take tens of seconds
    inputs:
      camera: ["string(front|wrist)", true, "which camera"]
      target: [string, true, "what to find, described by appearance and position"]
    engineering: true
  manifest:
    description: >-
      Mission control's logistics manifest: what each depot staging slot is recorded to hold, and the catalogue data of
      the standard items (size, mass, carry handle, documented contact regions and interface dimensions with source).
      Catalogue descriptions are prior equipment knowledge; current location and contact identity require observation.
      It is the record, not an
      observation: it can be out of date.
    inputs: {}
  arm_state:
    description: Arm posture from the joint encoders (stowed / ready / other), joint angles and the jaw angle.
    inputs: {}
  base_pose:
    description: The rover's own estimate of its planar pose in `map` (AMCL).
    inputs: {}
  tcp_pose:
    description: The tool centre point in `chassis_base_link` (arm kinematics).
    inputs: {}
  jaw:
    description: Jaw joint angle, rad (0.10 = closed on nothing, 0.82 = open).
    inputs: {}
  held_item:
    description: >-
      Two separate things about the gripper, not reconciled with each other. `observed`: whether anything is between
      the fingers and what it looks like, from the wrist camera (vision-language model on the current frame), asked
      without being told what to expect. `record`: what the last pick that succeeded took and from which support,
      with the jaw angle at that moment -- the boundary's own record of a call it made, not an observation.
      `jaw_rad` is the jaw now. The jaw angle alone cannot tell a jaw closed on nothing from one closed on a thin
      edge, and a payload that has dropped out leaves the jaws exactly where the grasp left them, so neither number
      identifies a load. Nor does the camera, when the load hangs from a handle: the jaws are clamped to the handle
      and the wrist camera looks straight at it, so the item's own body is below the frame and the head fills it.
      An `observed` description that does not match the `record` is more likely that geometry than a wrong payload;
      which of the two to act on is the caller's judgement. Use it to check a grasp, to find out whether something
      is still being carried, or to see what the gripper is on when a call failed for a reason that does not say.
    uses_model: true   # answered by the remote vision model, so it can legitimately take tens of seconds
    inputs: {}
  space_context:
    description: >-
      The body this robot is standing on and what it does to physics: its name, the gravity in force, and the
      light it gets. Gravity is not a constant of the software and it is not Earth's. A load hanging from the
      jaws leans atan(a/g) off vertical under a base acceleration a, and swings to about twice that after the
      step that starts it, so driving that would be gentle on Earth is six times the lean on the Moon; what a
      given grasp holds through is a property of that grasp, which the equipment catalogue describes. These are
      facts, not limits: the boundary keeps its own hardware-protecting limits whatever you conclude from them.
    inputs: {}

  work_stands:
    description: >-
      Where the rover can stand to work at a surveyed point. For every stand the reach model offers,
      `reaches_the_work` is whether the tool can end up at the grasp from there -- checked at the far end of the
      docking band (docking is verified to `dock_error_m`), so a stand offered here is one the rover can work from
      wherever the dock puts it; `reach_is_checked_at_m` says where. Each stand carries the `standoff_m` to pass to
      dock_at_feature to park there. Choosing the stand is yours; nothing about the camera's view depends on it.
    inputs:
      feature: [string, true, "site interaction point, e.g. depot_stand/slot_0"]
      grasp_height_m: [number, false, "how high above the site frame the part sits; defaults to the boundary's own work height, which is the tallest catalogued handle over any support"]

  locate_feature:
    description: >-
      Where a surveyed site interaction point is relative to the rover: position and outward normal in
      `chassis_base_link`, from the site survey placed by the rover's localization (expect several centimetres of
      error; use vision for contact).
    inputs:
      name: [string, true, "site interaction point, e.g. pdu_2_panel/press"]
