# Visual targets on the lunar base hardware (AprilTag 36h11), as the equipment documentation would list them.
# Carrier frames are the props' own authoring frames (assets/lunar_base/process/author_props.py: +X = the face the
# robot works from, Z up) and the movable objects' USD root frames. Poses: tag centre `xyz`, face `normal` (outward),
# `up` (tag top edge direction, default +Z). Textures are written into the carriers' USDs by
# space_robotics_bench/assets/lunar_base/scene/add_fiducials.py from this same file.

association_radius_m: 1.0  # a static-carrier detection belongs to the nearest surveyed instance within this distance

static_carriers:
  pdu_service_panel: [pdu_1_panel, pdu_2_panel, pdu_3_panel]
  pdu_service_shelf: [pdu_1_shelf, pdu_2_shelf, pdu_3_shelf]
  staging_stand: [depot_stand]

movable_carriers: [service_cover, spare_oru, spare_crate]

tags:
  # service panel: mount-plate face (x 0.02), beside the reset button and beside the lamp
  0: {carrier: pdu_service_panel, size_m: 0.05, xyz: [0.0205, 0.105, 0.78], normal: [1, 0, 0]}
  1: {carrier: pdu_service_panel, size_m: 0.05, xyz: [0.0205, -0.105, 0.95], normal: [1, 0, 0]}
  # spares shelf: target plate standing on the back strip above the shelf
  2: {carrier: pdu_service_shelf, size_m: 0.06, xyz: [0.0135, 0.0, 0.57], normal: [1, 0, 0], plate: true}
  # staging stand: back lip front face (x -0.27), one per slot
  3: {carrier: staging_stand, size_m: 0.05, xyz: [-0.2695, -0.32, 0.58], normal: [1, 0, 0]}
  4: {carrier: staging_stand, size_m: 0.05, xyz: [-0.2695, 0.32, 0.58], normal: [1, 0, 0]}
  # service cover: outer face of the plate, below the handle bar
  5: {carrier: service_cover, size_m: 0.07, xyz: [0.0125, 0.0, 0.13], normal: [1, 0, 0]}
  # spare ORU / cargo crate: a target plate standing on the top face beside the bail handle, 0.14 m along the handle
  # axis, one tag on each face (the two directions an arm approaches the bail from)
  6: {carrier: spare_oru, size_m: 0.06, xyz: [0.14, 0.004, 0.414], normal: [0, 1, 0], plate: true}
  7: {carrier: spare_oru, size_m: 0.06, xyz: [0.14, -0.004, 0.414], normal: [0, -1, 0], plate: true}
  8: {carrier: spare_crate, size_m: 0.06, xyz: [0.004, 0.14, 0.405], normal: [1, 0, 0], plate: true}
  9: {carrier: spare_crate, size_m: 0.06, xyz: [-0.004, 0.14, 0.405], normal: [-1, 0, 0], plate: true}
