# execution_plan.md §12 scenario manifest. Source of truth: docs/heldout_design.md §14, row "L1 | B:
# consumables container (landing offload stand) -> habitat logistics stand". `env.cargo=consumables_container
# env.destination=habitat` (experiments/launch/lunar_base_d0/jobs/step9_covered.txt).
manifest_version: 1
scenario_id: mission_b/covered/b_l1_consumables_habitat
mission_family: mission_b
coverage: covered

mission_brief: >
  Deliver the consumables container staged at the landing-pad offload stand (slot 0 per the manifest) to the
  habitat logistics stand, then return the rover to the dock with the arm stowed.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_b.yaml
  task_variant: lunar_base_mission_b_visual
  env_overrides: {env.scenario: covered, env.cargo: consumables_container, env.destination: habitat}
  scenery_override: null
  seed: 0
  cargo: consumables_container
  destination: habitat

required_capabilities:
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - pick
  - place
  - stow
  - observe

mission_deadline_s: null  # the protocol has no mission deadline (heldout_design §8); the episode never truncates (F114)
space_context_profile: null
perturbations_semantic_conditions: []

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_b.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "on_support(consumables_container, habitat_stand/slot_0) and parked_and_stowed() -- task.py mission_success()"
  fields_used: [scenario, cargo, destination, delivered, units, objects, parked_and_stowed, success]

notes: >
  Campaign instance 6 of 13 (docs/heldout_design.md §14). Precedent: Lewis et al. 2022 p.12, robots offload
  and bring logistics to the base before crew arrival (also cited in task.py's module docstring). This is the
  covered counterpart of the L2-B held-out instance in this same directory tree
  (mission_b/held_out/b_l2_destination_occupied_habitat.yaml), which uses the same cargo/destination but a
  different env.scenario value.
