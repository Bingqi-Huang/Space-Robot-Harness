# execution_plan.md §12 scenario manifest. Catalog ref: docs/lunar_task_catalog.md §3 "B1".
manifest_version: 1
scenario_id: mission_b/covered/b1_deliver_oru
mission_family: mission_b
coverage: covered

mission_brief: >
  Deliver the spare ORU staged at the depot stand (slot 0 per the manifest) to the spares shelf of
  {destination}, then return the rover to the dock with the arm stowed.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_b.yaml
  task_variant: lunar_base_mission_b_visual
  env_overrides: {env.scenario: covered}
  scenery_override: null
  seed: 0
  destination: pdu_1
  episode_length_s: 1200.0

required_capabilities:   # pick/place carry their own grasp/release internally -- not two separate calls
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - pick
  - place
  - stow
  - observe

mission_deadline_s: 1200.0
space_context_profile: null
perturbations_semantic_conditions: []

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_b.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "delivered and crate_stowed and at_dock(<=0.6m) and stowed(<=0.35rad) -- task.py _update_mission_state"
  fields_used: [oru_on, crate_on, delivered, success]

notes: >
  Exists today: openral/scenes/deploy/srb_lunar_base_mission_b.yaml sets env.scenario=covered.
  Launched via run_d0.sh (D0_CHECK=ours_mission_check.py OURS_MISSION=b).
