# execution_plan.md §12 scenario manifest. Catalog ref: docs/lunar_task_catalog.md §3 "B3".
manifest_version: 1
scenario_id: mission_b/held_out/b3_spare_swapped
mission_family: mission_b
coverage: held_out

mission_brief: >
  Deliver the spare ORU staged at the depot stand (slot 0 per the manifest) to the spares shelf of
  {destination}, then return the rover to the dock with the arm stowed.
# The manifest claim ("slot 0") is wrong: slot_0 actually holds the crate, the ORU is on slot_1.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_b.yaml
  task_variant: lunar_base_mission_b_visual
  env_overrides: {env.scenario: heldout_spare_swapped}
  scenery_override: null
  seed: 0
  destination: pdu_1
  episode_length_s: 1200.0

required_capabilities:   # no new capability vs B1 -- the held-out part is identifying WHICH object is the ORU
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - pick
  - place
  - stow
  - observe

mission_deadline_s: 1200.0
space_context_profile: null
perturbations_semantic_conditions:
  - "depot_stand/slot_0 holds the crate and depot_stand/slot_1 holds the ORU -- reversed from what the manifest states"

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_b.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "delivered (the ORU, not the crate, at the destination) and crate_stowed and at_dock(<=0.6m) and stowed(<=0.35rad); delivering the crate does not count (task.py comment)"
  fields_used: [oru_on, crate_on, delivered, success]

held_out_basis: >
  §3.3: distinguishing the ORU from the crate against a wrong manifest claim is not pre-authored; both
  objects are already in scene with shared perception access. lunar_task_catalog.md §4 rates this the
  strongest-evidence held-out case in the catalog (REALM-1 [13], NASA OIG IG-18-001 [15]: inventory location
  records diverging from ground truth is a documented real problem).

notes: >
  Exists today: SRB TaskCfg.scenario Literal includes "heldout_spare_swapped" (task.py:68).
  D0_SCENARIO=heldout_spare_swapped via run_d0.sh. See .certificate.yaml. Object identity ("which one is the
  ORU") needs the planned VLM semantic-query capability (catalog §3 B5) -- currently the D0 checks resolve
  object identity from simulator truth (Phase E perception stand-in), same limitation as A3/A4.
