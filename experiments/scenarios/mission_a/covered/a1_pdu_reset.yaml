# execution_plan.md §12 scenario manifest. Catalog ref: docs/lunar_task_catalog.md §3 "A1".
manifest_version: 1
scenario_id: mission_a/covered/a1_pdu_reset
mission_family: mission_a
coverage: covered

# Exact wording every method receives (srb/tasks/mobile_manipulation/lunar_base_mission_a/task.py
# TaskCfg.mission_brief()); {reported_pdu} substituted per instance.
mission_brief: >
  Power distribution unit {reported_pdu} reported a fault. Inspect the power field, identify the
  failed unit, restore it if within your authority, verify the result, and return the rover to the
  dock with the arm stowed.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_a.yaml
  task_variant: lunar_base_mission_a_visual
  env_overrides: {env.scenario: covered}
  scenery_override: null
  seed: 0
  faulted_pdu: pdu_2
  reported_pdu: pdu_2   # covered: reported_pdu == faulted_pdu
  episode_length_s: 900.0

required_capabilities:   # openral_ext/capability_server/contracts.yaml names; a valid covered solution needs only these
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - press
  - stow
  - observe
  - locate_in_view

mission_deadline_s: 900.0
space_context_profile: null   # space_context/ is still an empty placeholder (execution_plan §21.6-7)
perturbations_semantic_conditions: []   # covered: no obstruction, no mismatch

# Evaluator-only. Never placed where a method reads it (prompts/contracts/playbook/guard/verifier).
evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_a.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log (d0_common.py: log("MISSION", **mission))'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "not any(faults.values()) and at_dock(<=0.6m) and stowed(<=0.35rad) and cover_free(>0.30m) -- task.py _update_mission_state"
  fields_used: [faults, presses, blocked_presses, covered, success]

notes: >
  Exists today: openral/scenes/deploy/srb_lunar_base_mission_a.yaml already sets env.scenario=covered.
  Launched via experiments/launch/lunar_base_d0/run_d0.sh (Session M's files, D0_CHECK=ours_mission_check.py
  OURS_MISSION=a) -- this manifest is an evaluator-side description, not a launch script or a new runner.
