# execution_plan.md §12 scenario manifest. Source of truth: docs/heldout_design.md §14, row "L3 | BESS
# battery module fails self-test; spare on the depot spares stand". `heldout_module_failure`,
# `faulted_unit=bess`. task.py: initial_trips() sets bess's trip cause to MODULE_FAULT["battery module"] =
# BATTERY_MODULE_FAULT (self-test failure, SELFTEST_S after the breaker closes -- site.py); the failed module
# is `bat_bess` (FAULT_MODULE["bess"]); its staged spare `bat_spare` is NOT in unserviceable_modules() for
# this scenario (only {"bat_bess"}), i.e. it is serviceable.
manifest_version: 1
scenario_id: mission_a/held_out/a_l3_module_failure_bess
mission_family: mission_a
coverage: held_out
level: L3  # docs/heldout_design.md §2 novelty ladder, §14 row

mission_brief: >
  BESS reported a fault. Inspect the base's serviced units, identify the failed unit, restore it if within
  your authority, verify the result, and return the rover to the dock with the arm stowed.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_a.yaml
  task_variant: lunar_base_mission_a_visual
  env_overrides: {env.scenario: heldout_module_failure, env.faulted_unit: bess}
  scenery_override: null
  seed: 0
  faulted_unit: bess
  reported_unit: bess

required_capabilities:   # module removal/install adds pick+place to the covered set -- both are pre-freeze,
  - navigate_to_feature   # shared with Mission B's pick/place; no new capability
  - dock_at_feature
  - arm_ready
  - pick
  - place
  - press
  - stow
  - observe
  - locate_in_view

mission_deadline_s: null  # the protocol has no mission deadline (heldout_design §8); the episode never truncates (F114)
space_context_profile: null
perturbations_semantic_conditions:
  - "BESS closes on reset but trips again on its own power-on self-test (BATTERY_MODULE_FAULT) because its installed battery module (bat_bess) is unserviceable; a reset alone does not hold"
  - "the depot spares stand carries a serviceable spare battery module (bat_spare, recorded serviceable in the manifest)"

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_a.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "unit_healthy(bess) and parked_and_stowed() -- task.py mission_success(); unit_healthy requires bat_spare (not bat_bess) installed and the breaker holding closed past the self-test window"
  fields_used: [scenario, faulted_unit, reported_unit, units, objects, parked_and_stowed, success]

held_out_basis: >
  docs/heldout_design.md §2 L3 precedent: Dextre RPCM remove-and-replace on ISS, Aug 2011 (first robotic R&R
  of failed equipment); Lewis 2022 fault -> repair -> verify. §2: "every piece exists in both baselines'
  frozen libraries (Mission A reset, Mission B delivery), only the composition does not."

notes: >
  Campaign instance 11 of 13 (docs/heldout_design.md §14). No prior manifest existed for
  heldout_module_failure. Paired with a_l3_module_failure_isru.yaml (same env.scenario value, different
  faulted_unit -- same rows.py matching-ambiguity caveat).
