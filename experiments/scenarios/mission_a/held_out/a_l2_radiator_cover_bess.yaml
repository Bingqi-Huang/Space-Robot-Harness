# execution_plan.md §12 scenario manifest. Source of truth: docs/heldout_design.md §14, row "L2-A | BESS:
# HVAC condenser shutter drawn". `heldout_radiator_cover`, `faulted_unit=bess` (layout.yaml bess.cover =
# bess_hvac). Same scenario mechanism as a_l2_radiator_cover_pdu1.yaml, a different serviced unit.
manifest_version: 1
scenario_id: mission_a/held_out/a_l2_radiator_cover_bess
mission_family: mission_a
coverage: held_out
level: L2-A  # docs/heldout_design.md §2 novelty ladder, §14 row

mission_brief: >
  BESS reported a fault. Inspect the base's serviced units, identify the failed unit, restore it if within
  your authority, verify the result, and return the rover to the dock with the arm stowed.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_a.yaml
  task_variant: lunar_base_mission_a_visual
  env_overrides: {env.scenario: heldout_radiator_cover, env.faulted_unit: bess}
  scenery_override: null
  seed: 0
  faulted_unit: bess
  reported_unit: bess

required_capabilities:
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - press
  - stow
  - observe
  - locate_in_view

mission_deadline_s: null  # the protocol has no mission deadline (heldout_design §8); the episode never truncates (F114)
space_context_profile: null
perturbations_semantic_conditions:
  - "BESS's HVAC condenser shutter is drawn (d0_site_check.py checks this by asking the VLM whether the condenser's fans/fins are exposed or a dark roll-up shutter is drawn); a reset alone re-trips OVERTEMP after retrip_delay_s unless the shutter is opened first"

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_a.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "unit_healthy(bess) and parked_and_stowed() -- task.py mission_success()"
  fields_used: [scenario, faulted_unit, reported_unit, units, objects, parked_and_stowed, success]

held_out_basis: >
  Same as a_l2_radiator_cover_pdu1.yaml (docs/heldout_design.md §2 L2-A): LRV radiator dust covers opened for
  cooling (Creel, DAP-2017; TFAWS 2023); Apollo 16/17 battery over-temperature (Gaier, NASA/TM-2005-213610).

notes: >
  Campaign instance 9 of 13 (docs/heldout_design.md §14). ISRU has no radiator/HVAC cover (layout.yaml
  isru.cover: null) so L2-A is instantiated only on PDU-1 and BESS, matching §14 exactly (no ISRU L2-A row
  exists there).
