# execution_plan.md §12 scenario manifest. Source of truth: docs/heldout_design.md §14, row "L3 | ISRU
# filter cartridge clogged; spare on the ISRU receiving stand". `heldout_module_failure`,
# `faulted_unit=isru`. task.py: initial_trips() sets isru's trip cause to MODULE_FAULT["filter cartridge"] =
# FILTER_CLOGGED; the failed module is `flt_isru` (FAULT_MODULE["isru"]); its staged spare `flt_spare` is
# not in unserviceable_modules() for this scenario, i.e. serviceable.
manifest_version: 1
scenario_id: mission_a/held_out/a_l3_module_failure_isru
mission_family: mission_a
coverage: held_out
level: L3  # docs/heldout_design.md §2 novelty ladder, §14 row

mission_brief: >
  ISRU plant reported a fault. Inspect the base's serviced units, identify the failed unit, restore it if
  within your authority, verify the result, and return the rover to the dock with the arm stowed.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_a.yaml
  task_variant: lunar_base_mission_a_visual
  env_overrides: {env.scenario: heldout_module_failure, env.faulted_unit: isru}
  scenery_override: null
  seed: 0
  faulted_unit: isru
  reported_unit: isru

required_capabilities:
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - pick
  - place
  - press
  - stow
  - observe
  - locate_in_view

mission_deadline_s: null  # the protocol has no mission deadline (heldout_design §8); the episode never truncates (F114)
space_context_profile: null
perturbations_semantic_conditions:
  - "the ISRU plant closes on reset but trips again on its own power-on self-test (FILTER_CLOGGED) because its installed filter cartridge (flt_isru) is unserviceable; a reset alone does not hold"
  - "the ISRU receiving stand carries a serviceable spare filter cartridge (flt_spare, recorded serviceable in the manifest)"

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_a.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "unit_healthy(isru) and parked_and_stowed() -- task.py mission_success()"
  fields_used: [scenario, faulted_unit, reported_unit, units, objects, parked_and_stowed, success]

held_out_basis: >
  Same as a_l3_module_failure_bess.yaml (docs/heldout_design.md §2 L3): Dextre RPCM remove-and-replace on
  ISS, Aug 2011; Lewis 2022 fault -> repair -> verify.

notes: >
  Campaign instance 12 of 13 (docs/heldout_design.md §14). ISRU has two bays (isru_filter, isru_power per
  layout.yaml); this instance uses only the filter cartridge bay, matching FAULT_MODULE["isru"] =
  ("flt_isru", "flt_spare") in task.py.
