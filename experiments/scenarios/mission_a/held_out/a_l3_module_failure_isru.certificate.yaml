      pick the spare filter cartridge; navigate_to_feature+dock_at_feature back at the isru_filter bay; place
      the spare into the bay; press the panel reset button; power_status confirms it holds; stow; return to
      dock. Same capability set as the BESS L3 instance -- Mission A press/reset composed with Mission B
      pick/place; no new capability.
  required_observation_available_via_shared_perception:
    status: OPEN
    note: >-
