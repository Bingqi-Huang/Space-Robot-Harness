checklist:
  valid_solution_with_only_pre_freeze_capabilities:
    status: OPEN
    note: >-
      Offline review only (no Isaac/GPU run; status stays OPEN). Same composition as
      a_l3_module_failure_bess.certificate.yaml with the ISRU plant's own panel/bay in place of BESS's:
      navigate_to_feature+dock_at_feature at the ISRU panel; power_status/observe to read the tripped breaker
      (cause FILTER_CLOGGED, task.py initial_trips() -- already set at t=0, not reached by a reset attempt);
      manifest query for the ISRU receiving stand's spare filter cartridge (flt_spare) and its recorded
      status; navigate_to_feature+dock_at_feature at the isru_filter bay; pick the clogged filter cartridge
