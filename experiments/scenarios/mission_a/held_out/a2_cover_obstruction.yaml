# execution_plan.md §12 scenario manifest. Catalog ref: docs/lunar_task_catalog.md §3 "A2".
manifest_version: 1
scenario_id: mission_a/held_out/a2_cover_obstruction
mission_family: mission_a
coverage: held_out

mission_brief: >
  Power distribution unit {reported_pdu} reported a fault. Inspect the power field, identify the
  failed unit, restore it if within your authority, verify the result, and return the rover to the
  dock with the arm stowed.
# Same brief text as covered -- the obstruction is not named in the brief; §3.3 condition 4: the method
# gets only generic mission instructions, not a hint that a cover needs moving.

simulator:
  scene_config: openral/scenes/deploy/srb_lunar_base_mission_a.yaml
  task_variant: lunar_base_mission_a_visual
  env_overrides: {env.scenario: heldout_cover_obstruction}
  scenery_override: null
  seed: 0
  faulted_pdu: pdu_2
  reported_pdu: pdu_2
  episode_length_s: 900.0

required_capabilities:   # same closed set as A1 covered, plus grasp/place/release for the cover -- all pre-freeze
  - navigate_to_feature
  - dock_at_feature
  - arm_ready
  - grasp
  - place
  - release
  - press
  - stow
  - observe
  - locate_in_view

mission_deadline_s: 900.0
space_context_profile: null
perturbations_semantic_conditions:
  - "service cover leans on the faulted PDU's panel, physically blocking its reset button (task.py cover_blocks())"

evidence_verifier_mapping:
  source_topic: /srb/env0/mission_state
  produced_by: srb.tasks.mobile_manipulation.lunar_base_mission_a.task.Task.mission_state
  logged_as: 'MISSION {...} line in check.log'
  evaluator_only: true
  success_condition: "mission.success == true"
  success_definition: "not any(faults.values()) and at_dock(<=0.6m) and stowed(<=0.35rad) and cover_free(>0.30m)"
  fields_used: [faults, blocked_presses, covered, success]
  diagnostic_note: "blocked_presses > 0 means the method pressed while covered (a real button-press attempt logged as blocked, not counted toward success) -- useful for failure analysis, not itself the success condition."

held_out_basis: >
  §3.3 model-held-out: every primitive capability (grasp/place/release/press/navigate/dock) exists and is
  shared; the physical state (cover over the button) is camera-observable; the decomposition "diagnose why
  the press fails -> the cover blocks it -> move the cover -> retry" is not pre-authored in any frozen
  PLEXIL/EUROPA artifact today (F52 §2 shows Ours+the shared planning-scene stack completing this live, run
  ac5 -- but that predates any PLEXIL/EUROPA branch specific to this case).

notes: >
  Exists today: SRB TaskCfg.scenario Literal includes "heldout_cover_obstruction"
  (space_robotics_bench/srb/tasks/mobile_manipulation/lunar_base_mission_a/task.py:65). D0_SCENARIO=heldout_cover_obstruction
  via run_d0.sh. See .certificate.yaml for the closed-capability validator record.
